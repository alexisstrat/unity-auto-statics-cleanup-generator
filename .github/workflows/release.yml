name: Release

# Releases are cut by pushing a version tag (e.g. `git tag v1.1.0 && git push
# origin v1.1.0`) on main after the release PR is merged. The workflow
# verifies the tag matches <Version> in AutoStaticsCleanup.csproj, extracts
# the matching "## vx.y.z" section from CHANGELOG.md as the release notes,
# and publishes the Release with the attested DLL and the setup
# .unitypackage (built from UnityPackage/ — attributes, DelegateAutoCleanup,
# editor registrar; the DLL itself is not inside the package) attached.

on:
  push:
    tags: ['v*']

permissions:
  contents: write       # to create the GitHub Release and attach assets
  id-token: write       # required by attest-build-provenance for OIDC
  attestations: write   # to write the attestation

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches project version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          CSPROJ_VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' AutoStaticsCleanup/AutoStaticsCleanup.csproj)
          if [ "$VERSION" != "$CSPROJ_VERSION" ]; then
            echo "::error::Tag v$VERSION does not match <Version>$CSPROJ_VERSION</Version> in AutoStaticsCleanup.csproj."
            exit 1
          fi

      - name: Verify CHANGELOG has a section for this version
        run: |
          awk -v ver="$VERSION" '
            $0 == "## v" ver { found = 1; next }
            found && /^## v/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! [ -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no \"## v$VERSION\" section — add one before tagging."
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: dotnet restore AutoStaticsCleanup.sln

      - run: dotnet build AutoStaticsCleanup.sln -c Release --no-restore

      - run: dotnet test AutoStaticsCleanup.Tests/AutoStaticsCleanup.Tests.csproj -c Release --no-build --verbosity normal

      - name: Build setup .unitypackage
        run: ./UnityPackage/build-unitypackage.sh "AutoStaticsCleanup-Setup-$VERSION.unitypackage"

      - name: Compute SHA-256
        id: checksum
        run: |
          sha256sum "AutoStaticsCleanup-Setup-$VERSION.unitypackage" > "AutoStaticsCleanup-Setup-$VERSION.unitypackage.sha256"
          echo "package_sha256=$(cut -d' ' -f1 < "AutoStaticsCleanup-Setup-$VERSION.unitypackage.sha256")" >> "$GITHUB_OUTPUT"
          cd AutoStaticsCleanup/bin/Release/netstandard2.0
          sha256sum AutoStaticsCleanup.dll > AutoStaticsCleanup.dll.sha256
          echo "sha256=$(cut -d' ' -f1 < AutoStaticsCleanup.dll.sha256)" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            AutoStaticsCleanup/bin/Release/netstandard2.0/AutoStaticsCleanup.dll
            AutoStaticsCleanup-Setup-*.unitypackage

      - name: Append verification section to release notes
        run: |
          {
            echo ""
            echo "## Verification"
            echo ""
            echo "**SHA-256 (\`AutoStaticsCleanup.dll\`):** \`${{ steps.checksum.outputs.sha256 }}\`"
            echo "**SHA-256 (\`AutoStaticsCleanup-Setup-$VERSION.unitypackage\`):** \`${{ steps.checksum.outputs.package_sha256 }}\`"
            echo ""
            echo "Verify the build-provenance attestations:"
            echo ""
            echo '```bash'
            echo "gh attestation verify AutoStaticsCleanup.dll \\"
            echo "  --repo ${{ github.repository }}"
            echo "gh attestation verify AutoStaticsCleanup-Setup-$VERSION.unitypackage \\"
            echo "  --repo ${{ github.repository }}"
            echo '```'
            echo ""
            echo "See the [Installation section in the README](./README.md#installation) for usage."
          } >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            AutoStaticsCleanup/bin/Release/netstandard2.0/AutoStaticsCleanup.dll
            AutoStaticsCleanup/bin/Release/netstandard2.0/AutoStaticsCleanup.dll.sha256
            AutoStaticsCleanup-Setup-*.unitypackage
            AutoStaticsCleanup-Setup-*.unitypackage.sha256
